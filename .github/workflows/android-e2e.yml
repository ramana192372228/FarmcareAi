name: Android Appium E2E Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android-appium-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Stage 1: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage 2: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Stage 3 & 4: Setup Android SDK & Dependencies
        uses: android-actions/setup-android@v3

      - name: Stage 5: Setup Flutter & Build APK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Debug APK
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Stage 6, 7, 8, 9 & 10: Launch Android Emulator, Appium & Run E2E Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            npm install -g appium
            appium driver install uiautomator2 || true
            appium &
            sleep 10
            cd appium-automation
            npm install
            npm test

      - name: Stage 14, 15, 16, 17: Reports Artifact Preparation
        if: always()
        run: |
          echo "Appium reports generated."

      - name: Stage 18: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appium_Android_E2E_Test_Reports
          path: |
            Test Results/Excel/
            Test Results/HTML/
            Test Results/JSON/
            Test Results/Summary/
          retention-days: 30

      - name: Stage 19 & 20: Publish Reports & Update History
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Test Results/HTML
          destination_dir: reports/latest

      - name: Stage 21: Publish GitHub Action Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
