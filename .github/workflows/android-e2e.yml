name: Android Appium E2E Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  android-appium-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Debug APK
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Execute Android E2E Tests
        run: |
          cd appium-automation
          npm install
          npm test

      - name: Upload Appium Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appium_Android_E2E_Test_Reports
          path: |
            Test Results/Excel/
            Test Results/HTML/
            Test Results/JSON/
            Test Results/Summary/
          retention-days: 30

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: Test Results/HTML

      - name: Deploy Reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: always()

      - name: Publish GitHub Action Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
