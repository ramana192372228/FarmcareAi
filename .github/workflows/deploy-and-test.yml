name: Deploy to GitHub Pages and Run Live Selenium E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies and Build Web App
        run: |
          flutter pub get
          flutter build web --release --base-href "/FarmcareAi/"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install Selenium Automation Dependencies
        run: |
          cd selenium-automation
          npm install

      - name: Run Live Selenium E2E Tests
        env:
          BASE_URL: https://ramana192372228.github.io/FarmcareAi/
        run: |
          cd selenium-automation
          npm test

      - name: Upload Test Results Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Selenium_Live_E2E_Test_Reports
          path: |
            Test Results/Excel/
            Test Results/HTML/
            Test Results/JSON/
            Test Results/Summary/
          retention-days: 30

      - name: Publish Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
